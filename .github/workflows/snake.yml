# 生成「贡献贪吃蛇」动画，并推送到 output 分支
# 文档：https://github.com/Platane/snk
#
# README 中引用的地址：
#   https://raw.githubusercontent.com/<用户名>/<用户名>/output/github-snake.svg
#   https://raw.githubusercontent.com/<用户名>/<用户名>/output/github-snake-dark.svg

name: Generate Snake

on:
  schedule:
    # 每天 UTC 18:30 / 北京时间 02:30
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-contribution-snake
    timeout-minutes: 15

    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
